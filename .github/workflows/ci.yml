name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kindspring_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kindspring_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kindspring_test
      APP_BASE_URL: http://localhost:3100
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
      DATA_ENCRYPTION_KEY: Y2ktb25seS1kYXRhLWVuY3J5cHRpb24ta2V5LTMyYg==
      PAYMENT_PROVIDER: sandbox
      SANDBOX_WEBHOOK_SECRET: ci-sandbox-secret
      CRON_SECRET: ci-cron-secret-1234567
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
